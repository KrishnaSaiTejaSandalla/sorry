<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>Sorry</title>
</head>

<body>

  <div class="question-container container">
    <video class="gif-result" style="width: 200px; height: 200px; margin-left: 250px;" src="Reply me love.mp4" autoplay
      muted loop></video>
    <h2 class="question">Will You forgive me Plz 🥺</h2>
    <div class="button-container">
      <button class="yes-btn btn js-yes-btn">Yes</button>
      <button class="no-btn btn js-no-btn">No</button>
    </div>
  </div>
  <div class="result-container container">
    <video class="gif-result" src="Love me.mp4" autoplay muted loop></video>
    <h2>I knew it😍!</h2>
  </div>

  <!-- Hug Loader -->
  <div class="hug-loader">
    <div class="hug-scene">
      <span class="hug-fig hug-chaser">🏃‍➡️</span>
      <span class="hug-fig hug-chasee">🧍‍♀️</span>
      <span class="hug-pop">🤗</span>
    </div>
    <p class="hug-text">wait for it… 💕</p>
  </div>

  <script src="script.js"></script>

</body>

</html>
