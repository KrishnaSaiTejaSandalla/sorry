<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>Sorry</title>
</head>

<body>

  <div class="question-container container">
    <video class="gif-result" style="width: 200px; height: 200px; margin-left: 250px;" src="Reply me love.mp4" autoplay
      muted loop></video>
    <h2 class="question">Rithu!! Will You forgive me Plz 🥺</h2>
    <div class="button-container">
      <button class="yes-btn btn js-yes-btn">Yes</button>
      <button class="no-btn btn js-no-btn">No</button>
    </div>
  </div>
  <div class="result-container container">
    <video class="gif-result" src="Love me.mp4" autoplay muted loop></video>
    <h2>I knew it😍!</h2>
  </div>

  <!-- Message Loading Component -->
  <div class="message-loading">
    <svg width="80" height="80" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="message-loader">
      <circle cx="4" cy="12" r="2" fill="currentColor">
        <animate begin="0s" attributeName="cy" calcMode="spline" dur="0.6s" values="12;6;12"
          keySplines=".33,.66,.66,1;.33,0;.66,.33" repeatCount="indefinite" />
      </circle>

      <circle cx="12" cy="12" r="2" fill="currentColor">
        <animate begin="0.1s" attributeName="cy" calcMode="spline" dur="0.6s" values="12;6;12"
          keySplines=".33,.66,.66,1;.33,0;.66,.33" repeatCount="indefinite" />
      </circle>

      <circle cx="20" cy="12" r="2" fill="currentColor">
        <animate begin="0.2s" attributeName="cy" calcMode="spline" dur="0.6s" values="12;6;12"
          keySplines=".33,.66,.66,1;.33,0;.66,.33" repeatCount="indefinite" />
      </circle>
    </svg>
  </div>

  <script src="script.js"></script>

</body>

</html>
